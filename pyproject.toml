[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jade-vault"
version = "0.4.0"
description = "Jade, the agent from Jade Vault, in Python: use her as a library, a REPL, an HTTP API, or step by step"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "lucky-edgelord" }]
keywords = ["agent", "llm", "ollama", "notes", "obsidian", "tools", "repl"]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13",
  "prompt_toolkit>=3.0.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2",
  "croniter>=2",
  "tomli-w>=1",
  "pyyaml>=6",
  "markdownify>=0.12",
  "beautifulsoup4>=4.12",
  "sqlite-vec>=0.1.6",
  "numpy>=1.26",
  "cryptography>=42",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
ssh = ["asyncssh>=2.14"]
discord = ["discord.py>=2.3"]
browser = ["playwright>=1.44"]
all = ["mcp>=1.2", "asyncssh>=2.14", "discord.py>=2.3", "playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
jade = "jade.cli:main"

[project.urls]
Homepage = "https://github.com/lucky-edgelord/jade-py"
"Jade Vault (the app)" = "https://github.com/lucky-edgelord/jade-vault"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jade = ["seed/**/*", "seed/*", "*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
